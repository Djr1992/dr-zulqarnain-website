<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradients & Filters -->
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a2412" />
      <stop offset="100%" stop-color="#381308" />
    </linearGradient>
    <linearGradient id="deskTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fefefe" />
      <stop offset="100%" stop-color="#eae6df" />
    </linearGradient>
    <linearGradient id="deskLeg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#555d65" />
      <stop offset="100%" stop-color="#2c3238" />
    </linearGradient>
    <linearGradient id="scrubs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b365d" />
      <stop offset="50%" stop-color="#122442" />
      <stop offset="100%" stop-color="#0a172c" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8d5c2" />
      <stop offset="50%" stop-color="#e2aa8f" />
      <stop offset="100%" stop-color="#c98c70" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b271d" />
      <stop offset="100%" stop-color="#160e0a" />
    </linearGradient>
    <linearGradient id="glassWater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.85)" />
      <stop offset="50%" stop-color="rgba(190, 230, 248, 0.55)" />
      <stop offset="100%" stop-color="rgba(130, 200, 235, 0.75)" />
    </linearGradient>
    <linearGradient id="shoeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#733320" />
      <stop offset="100%" stop-color="#401a0e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="6" stdDeviation="8" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- CLINIC BACKGROUND -->
  <!-- Base Light Gray Wall -->
  <rect width="800" height="900" fill="#e2e7ec" />

  <!-- VERTICAL CYAN/BLUE AND WHITE STRIPED ACCENT WALL (LEFT SIDE) -->
  <g id="stripedWall">
    <!-- White Base -->
    <rect x="0" y="0" width="460" height="700" fill="#ffffff" />
    <!-- Vertical Cyan Stripes -->
    <rect x="22" y="0" width="22" height="700" fill="#00a3d9" />
    <rect x="66" y="0" width="22" height="700" fill="#00a3d9" />
    <rect x="110" y="0" width="22" height="700" fill="#00a3d9" />
    <rect x="154" y="0" width="22" height="700" fill="#00a3d9" />
    <rect x="198" y="0" width="22" height="700" fill="#00a3d9" />
    <rect x="242" y="0" width="22" height="700" fill="#00a3d9" />
    <rect x="286" y="0" width="22" height="700" fill="#00a3d9" />
    <rect x="330" y="0" width="22" height="700" fill="#00a3d9" />
    <rect x="374" y="0" width="22" height="700" fill="#00a3d9" />
    <rect x="418" y="0" width="22" height="700" fill="#00a3d9" />
  </g>

  <!-- Plain Light Gray Wall Section (Middle-Right) -->
  <rect x="460" y="0" width="180" height="700" fill="#cbcfd4" />

  <!-- CORNER FLOATING SHELVES (RIGHT OF STRIPED WALL) -->
  <g id="cornerShelves">
    <!-- Vertical Shelf Backing Panel -->
    <path d="M 470 0 L 610 0 L 610 420 L 470 420 Z" fill="#9faab5" stroke="#87939e" stroke-width="2" />
    
    <!-- Top Shelf -->
    <polygon points="470,90 610,90 600,105 480,105" fill="#c3cbd3" />
    <rect x="470" y="105" width="140" height="12" fill="#87939e" />
    <!-- White Sanitizer/Disinfectant Container on Top Shelf -->
    <rect x="520" y="30" width="40" height="60" rx="5" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.5" />
    <rect x="518" y="22" width="44" height="12" rx="3" fill="#d32f2f" />
    <rect x="528" y="48" width="24" height="12" fill="#d32f2f" opacity="0.8" />

    <!-- Middle Shelf -->
    <polygon points="470,220 610,220 600,235 480,235" fill="#c3cbd3" />
    <rect x="470" y="235" width="140" height="12" fill="#87939e" />
    <!-- Folded Blue Towel/Cloth on Middle Shelf -->
    <rect x="490" y="195" width="100" height="25" rx="4" fill="#2b4c7e" stroke="#1c3356" stroke-width="1.5" />

    <!-- Bottom Shelf -->
    <polygon points="470,330 610,330 600,345 480,345" fill="#c3cbd3" />
    <rect x="470" y="345" width="140" height="12" fill="#87939e" />
    <!-- Magazines / Pamphlets on Bottom Shelf -->
    <rect x="500" y="318" width="80" height="12" rx="2" fill="#dedede" stroke="#aaaaaa" stroke-width="1" />
  </g>

  <!-- DARK WOODEN DOOR ON RIGHT -->
  <g id="woodenDoor">
    <rect x="630" y="0" width="170" height="480" fill="url(#doorGrad)" />
    <!-- Door Trim -->
    <rect x="622" y="0" width="12" height="480" fill="#2d0f06" />
    <rect x="645" y="15" width="140" height="450" fill="none" stroke="#230b04" stroke-width="3" />
    <!-- Golden Metallic Door Handle -->
    <circle cx="680" cy="200" r="8" fill="#d4af37" />
    <rect x="680" y="196" width="28" height="8" rx="4" fill="#d4af37" />
  </g>

  <!-- EXECUTIVE WHEELED MESH CHAIR (BEHIND DOCTOR) -->
  <g id="executiveChair">
    <!-- Curved Mesh Backrest -->
    <path d="M 100 300 Q 180 260 250 300 L 260 620 L 90 620 Z" fill="#1e2227" filter="url(#shadow)" />
    <rect x="105" y="310" width="135" height="280" rx="16" fill="#292e34" stroke="#121518" stroke-width="3" />
    
    <!-- Chair Base & Wheels underneath -->
    <path d="M 115 670 L 310 670 L 290 850 L 135 850 Z" fill="#121518" />
    <circle cx="120" cy="820" r="14" fill="#333" />
    <circle cx="170" cy="850" r="14" fill="#333" />
    <circle cx="270" cy="850" r="14" fill="#333" />
  </g>

  <!-- DOCTOR'S LEGS & BROWN LEATHER SHOES UNDERNEATH DESK -->
  <g id="legsAndShoes">
    <!-- Pants (Dark Navy Scrubs) -->
    <path d="M 220 580 L 280 580 L 305 780 L 245 780 Z" fill="#122442" />
    <path d="M 315 580 L 375 580 L 415 760 L 355 760 Z" fill="#122442" />

    <!-- Left Shoe (Brown Leather Loafer) -->
    <path d="M 230 780 C 220 810, 240 850, 280 850 C 300 850, 310 820, 290 780 Z" fill="url(#shoeGrad)" filter="url(#shadow)" />
    <path d="M 245 800 Q 265 790 280 810" fill="none" stroke="#311309" stroke-width="2.5" />

    <!-- Right Shoe (Brown Leather Loafer) -->
    <path d="M 345 760 C 335 790, 355 830, 395 830 C 415 830, 425 800, 405 760 Z" fill="url(#shoeGrad)" filter="url(#shadow)" />
    <path d="M 360 780 Q 380 770 395 790" fill="none" stroke="#311309" stroke-width="2.5" />
  </g>

  <!-- DR. MUHAMMAD ZULQARNAIN (PORTRAIT BODY) -->
  <g id="doctorBody">
    <!-- Torso in Dark Navy Scrubs -->
    <path d="M 140 460 Q 310 350 480 460 L 500 680 L 120 680 Z" fill="url(#scrubs)" filter="url(#shadow)" />
    
    <!-- V-Neck Scrub Collar & Neck Skin -->
    <path d="M 265 370 L 320 450 L 375 370 Z" fill="url(#skinGrad)" />
    <path d="M 260 365 L 320 455 L 270 375 Z" fill="#0a172c" />
    <path d="M 380 365 L 320 455 L 370 375 Z" fill="#0a172c" />

    <!-- Stethoscope -->
    <path d="M 255 380 C 245 460, 305 510, 320 510 C 335 510, 395 460, 385 380" fill="none" stroke="#111111" stroke-width="12" stroke-linecap="round" />
    <path d="M 255 380 C 245 460, 305 510, 320 510 C 335 510, 395 460, 385 380" fill="none" stroke="#444444" stroke-width="7" stroke-linecap="round" />
    <!-- Metallic Chest Piece -->
    <circle cx="348" cy="485" r="15" fill="#d0d5dd" stroke="#777" stroke-width="2" />
    <circle cx="348" cy="485" r="9" fill="#888" />

    <!-- Arms resting on Desk -->
    <!-- Left Arm & Forearm -->
    <path d="M 140 460 Q 180 550 340 560 L 340 610 L 120 610 Z" fill="url(#scrubs)" />
    <path d="M 310 545 Q 380 545 440 555 L 440 595 L 310 585 Z" fill="url(#skinGrad)" />

    <!-- Right Arm & Forearm -->
    <path d="M 480 460 Q 430 530 500 570 L 530 610 L 470 610 Z" fill="url(#scrubs)" />
    <path d="M 440 545 Q 480 545 515 555 L 505 595 L 430 585 Z" fill="url(#skinGrad)" />

    <!-- Metallic Wrist Watch on Left Wrist -->
    <rect x="425" y="540" width="14" height="20" rx="3" fill="#a0aab2" stroke="#666" stroke-width="1" />

    <!-- Neck -->
    <rect x="290" y="315" width="60" height="65" fill="url(#skinGrad)" rx="10" />
    <path d="M 290 355 Q 320 375 350 355 L 350 375 L 290 375 Z" fill="rgba(90,35,15,0.22)" />

    <!-- Face / Head -->
    <ellipse cx="320" cy="245" rx="66" ry="80" fill="url(#skinGrad)" filter="url(#shadow)" />
    
    <!-- Hair (Neat Side-Parted Dark Hair) -->
    <path d="M 248 225 C 242 155, 320 135, 392 165 C 400 205, 395 235, 392 245 C 380 195, 320 155, 255 220 Z" fill="url(#hairGrad)" />
    <path d="M 252 225 C 248 185, 280 150, 335 145 C 370 140, 395 160, 395 180 C 370 155, 320 155, 258 225 Z" fill="#463125" />

    <!-- Ears -->
    <ellipse cx="252" cy="250" rx="9" ry="15" fill="url(#skinGrad)" />
    <ellipse cx="388" cy="250" rx="9" ry="15" fill="url(#skinGrad)" />

    <!-- Eyebrows -->
    <path d="M 272 215 Q 292 207 307 215" fill="none" stroke="#23140c" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 333 215 Q 348 207 368 215" fill="none" stroke="#23140c" stroke-width="4.5" stroke-linecap="round" />

    <!-- Eyes -->
    <ellipse cx="290" cy="228" rx="9" ry="6" fill="#ffffff" />
    <circle cx="290" cy="228" r="4.5" fill="#26160b" />
    <circle cx="291" cy="227" r="1.5" fill="#ffffff" />

    <ellipse cx="350" cy="228" rx="9" ry="6" fill="#ffffff" />
    <circle cx="350" cy="228" r="4.5" fill="#26160b" />
    <circle cx="351" cy="227" r="1.5" fill="#ffffff" />

    <!-- Eyeglasses (Modern black frame) -->
    <rect x="268" y="216" width="44" height="27" rx="8" fill="rgba(255,255,255,0.18)" stroke="#1a1a1a" stroke-width="3.5" />
    <rect x="328" y="216" width="44" height="27" rx="8" fill="rgba(255,255,255,0.18)" stroke="#1a1a1a" stroke-width="3.5" />
    <path d="M 312 224 Q 320 220 328 224" fill="none" stroke="#1a1a1a" stroke-width="3.5" />
    <line x1="268" y1="224" x2="252" y2="222" stroke="#1a1a1a" stroke-width="3" />
    <line x1="372" y1="224" x2="388" y2="222" stroke="#1a1a1a" stroke-width="3" />

    <!-- Nose -->
    <path d="M 320 228 L 316 255 Q 320 261 324 255 Z" fill="none" stroke="#ba7a5d" stroke-width="2.5" stroke-linecap="round" />

    <!-- Beard Stubble -->
    <path d="M 262 255 Q 320 325 378 255 Q 378 310 320 320 Q 262 310 262 255 Z" fill="rgba(35,20,12,0.2)" />

    <!-- Confident Warm Smile -->
    <path d="M 298 284 Q 320 300 342 284" fill="none" stroke="#883020" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 302 286 Q 320 294 338 286" fill="#ffffff" opacity="0.85" />
  </g>

  <!-- MODERN EXECUTIVE DESK (FRONT FOREGROUND) -->
  <g id="executiveDesk">
    <!-- Desk Surface Top -->
    <polygon points="120,560 720,560 760,620 80,620" fill="url(#deskTop)" filter="url(#shadow)" />
    <polygon points="120,560 720,560 720,566 120,566" fill="#e0d6cb" />

    <!-- Desk Front Facade -->
    <polygon points="80,620 760,620 720,890 120,890" fill="#f5f2ed" stroke="#d5cecc" stroke-width="2" />
    
    <!-- Modern Metallic Gray Desk Frame / Legs -->
    <polygon points="70,615 170,615 190,895 100,895" fill="url(#deskLeg)" />
    <polygon points="660,615 760,615 730,895 630,895" fill="url(#deskLeg)" />
    <!-- Light Wood Modesty Panel Insert -->
    <polygon points="195,635 625,635 605,870 215,870" fill="#e8ded2" stroke="#c8bcaf" stroke-width="2" />

    <!-- DESK ITEMS (EXACT MATCH TO PHOTO) -->
    
    <!-- Glass of Water on Wooden Coaster -->
    <!-- Round Wooden Coaster -->
    <ellipse cx="380" cy="585" rx="30" ry="11" fill="#be9564" stroke="#926d40" stroke-width="2" />
    <!-- Glass Body -->
    <path d="M 362 580 L 366 538 L 394 538 L 398 580 Z" fill="url(#glassWater)" stroke="rgba(255,255,255,0.9)" stroke-width="2" />
    <path d="M 364 575 L 367 548 L 393 548 L 396 575 Z" fill="rgba(150,215,245,0.6)" />

    <!-- Pure Tissue Box (Green/Dark Green Box with White Puff) -->
    <polygon points="440,588 560,588 570,552 450,552" fill="#1b4d3e" />
    <polygon points="440,588 560,588 560,605 440,605" fill="#0d2b22" />
    <!-- White Tissue Puff -->
    <path d="M 480 552 Q 500 520 515 510 Q 530 520 540 552 Z" fill="#ffffff" opacity="0.95" filter="url(#shadow)" />
    <text x="458" y="580" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">PURE TISSUE</text>

    <!-- Medical Prescription Papers & Tray -->
    <polygon points="560,562 690,562 700,535 570,535" fill="#e9ecef" stroke="#ced4da" stroke-width="1.5" />
    <polygon points="565,558 685,558 690,540 575,540" fill="#ffffff" />
    <!-- Red Capped Sanitizer/Medicine Container on Desk Tray -->
    <rect x="700" y="515" width="26" height="42" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1.5" />
    <rect x="698" y="508" width="30" height="10" rx="3" fill="#d32f2f" />

  </g>
</svg>
